ingredients:
  - name: flour
    amount: 281
    units: g
  - name: baking soda
    amount: 1
    units: tsp
  - name: cornstarch
    amount: 1.5
    units: tsp
  - name: salt
    amount: 0.5
    units: tsp
  - name: butter
    amount: 170
    units: g
  - name: brown sugar
    amount: 150
    units: g
  - name: granulated sugar
    amount: 100
    units: g
  - name: egg
    amount: 1
  - name: egg yolk
    amount: 1
  - name: vanilla extract
    amount: 2
    units: tsp
  - name: chocolate chips
    amount: 225
    units: g
equipment:
  - large bowl
  - whisk
  - microwave
  - medium bowl
  - oven
  - baking sheet
steps:
  dry ingredients:
    - large bowl
      whisk
    - flour
      baking soda
      cornstarch
      salt
  melted butter:
    - microwave
    - butter
  creamed butter:
    - medium bowl
    - melted butter
      brown sugar
      granulated sugar
  wet ingredients:
    - medium bowl
    - creamed butter
      egg
      egg yolk
      vanilla extract
  cookie dough:
    - large bowl
    - dry ingredients
      wet ingredients
      chocolate chips
  chilled cookie dough:
    - fridge
    - cookie dough
  uncooked cookies:
    - baking sheet
    - chilled cookie dough
  cookies:
    - oven
    - uncooked cookies

