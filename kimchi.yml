ingredients:
  - id: cabbage
    amount: 1.5
    units: lb
  - id: salt
    amount: 6
    units: Tbsp
  - id: oyster sauce
    amount: 1
    units: Tbsp
  - id: water
    amount: 1
    units: cup
  - id: salt
    amount: 0.5
    units: tsp
  - id: rice flour
    amount: 2
    units: Tbsp
  - id: water
    amount: 1
    units: Tbsp
  - id: granulated sugar
    amount: 1
    units: Tbsp
  - id: garlic
  - id: ginger
  - id: onion
  - id: gochu-garu
    amount: 0.5
    units: cup
  - id: carrot
  - id: radish
  - id: chives
  - id: green onions

steps:
  id: salted cabbage
  combine:
      - cabbage
      - salt

  id: rice paste
  heat:
    - oyster sauce
    - rice flour
    - granulated sugar

  id: aromatic puree
  puree:
    - garlic
    - ginger
    - onion

  id: kimchi paste
  mix:
    - rice paste
    - aromatic puree
    - gochu-garu

  id: kimchi
  mix:
    - salted cabbage
    - kimchi paste
    - carrot
    - radish
    - chives
    - green onions