ingredients:
  - id: flour
    amount: 281
    units: g
  - id: baking soda
    amount: 1
    units: tsp
  - id: cornstarch
    amount: 1.5
    units: tsp
  - id: salt
    amount: 0.5
    units: tsp
  - id: melted butter
    amount: 170
    units: g
  - id: brown sugar
    amount: 150
    units: g
  - id: granulated sugar
    amount: 100
    units: g
  - id: egg
    amount: 1
  - id: egg yolk
    amount: 1
  - id: vanilla extract
    amount: 2
    units: tsp
  - id: chocolate chips
    amount: 225
    units: g

steps:
  id: dry ingredients
  whisk:
      - flour
      - baking soda
      - cornstarch
      - salt

  id: creamed butter
  cream:
    - melted butter
    - brown sugar
    - granulated sugar

  id: wet ingredients
  mix:
    - creamed butter
    - egg
    - egg yolk
    - vanilla extract

  id: cookie dough
  mix:
    - dry ingredients
    - wet ingredients
    - chocolate chips

  id: chilled cookie dough
  fridge:
    - cookie dough

  id: portioned cookie dough
  portion:
    - chilled cookie dough

  id: cookies
  bake:
    - portioned cookie dough
