<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Submit Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 680px;
        margin: 40px auto;
        padding: 0 16px;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        padding: 8px;
      }
      button {
        padding: 8px 14px;
      }
      #result {
        margin-top: 16px;
        font-weight: 600;
      }
      #json-output {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #flowchart {
        margin-top: 16px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Submit URL</h1>
    <form id="url-form">
      <input id="url-input" type="url" placeholder="https://example.com" required />
      <button type="submit">Send</button>
    </form>
    <p id="result"></p>
    <pre id="json-output"></pre>
    <div id="flowchart"></div>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

      const form = document.getElementById("url-form");
      const urlInput = document.getElementById("url-input");
      const result = document.getElementById("result");
      const jsonOutput = document.getElementById("json-output");
      const flowchart = document.getElementById("flowchart");

      async function renderFlowchart(markup) {
        if (!markup) {
          flowchart.innerHTML = "";
          return;
        }

        const id = `recipe-flowchart-${Date.now()}`;
        const { svg } = await mermaid.render(id, markup);
        flowchart.innerHTML = svg;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        result.textContent = "Loading...";
        jsonOutput.textContent = "";
        flowchart.innerHTML = "";

        const response = await fetch("/api/submit-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: urlInput.value })
        });

        const data = await response.json();
        
        console.log(data)

        if (!response.ok) {
          result.textContent = data.error || "Request failed";
          return;
        }

        result.textContent = "Recipe graph generated.";
        jsonOutput.textContent = JSON.stringify(data, null, 2);
        await renderFlowchart(data.flowchartMermaid);
      });
    </script>
  </body>
</html>
