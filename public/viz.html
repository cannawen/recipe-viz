<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Graph</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: 1fr 36px;
      }

      #graph {
        overflow: auto;
        padding: 16px;
      }

      #status {
        height: 36px;
        line-height: 36px;
        padding: 0 12px;
        border-top: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #111827;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="status">Loading graph…</div>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      const graphEl = document.getElementById("graph");
      const statusEl = document.getElementById("status");

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose"
      });

      async function renderGraph() {
        const response = await fetch("/recipe.mmd", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed to load /recipe.mmd (${response.status})`);
        }

        const graphDefinition = await response.text();
        if (!graphDefinition.trim()) {
          throw new Error("Mermaid graph is empty");
        }

        const { svg } = await mermaid.render("recipe-graph", graphDefinition);
        graphEl.innerHTML = svg;
        statusEl.textContent = "Loaded Mermaid graph from /recipe.mmd";
      }

      renderGraph().catch((error) => {
        console.error(error);
        statusEl.textContent = error.message || "Failed to render graph";
      });
    </script>
  </body>
</html>
