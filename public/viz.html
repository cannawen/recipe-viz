<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Graph</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: 48px 1fr 36px;
      }

      #controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid #e5e7eb;
        background: #f9fafb;
      }

      #recipe-select {
        height: 30px;
      }

      #graph {
        overflow: auto;
        padding: 16px;
      }

      #status {
        height: 36px;
        line-height: 36px;
        padding: 0 12px;
        border-top: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #111827;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label for="recipe-select">Recipe:</label>
      <select id="recipe-select">
        <option value="recipe">recipe.yml</option>
        <option value="kimchi">recipe-kimchi.yml</option>
      </select>
    </div>
    <div id="graph"></div>
    <div id="status">Loading graph…</div>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      const graphEl = document.getElementById("graph");
      const statusEl = document.getElementById("status");
      const recipeSelectEl = document.getElementById("recipe-select");

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose"
      });

      const url = new URL(window.location.href);
      const recipeParam = (url.searchParams.get("recipe") || "recipe").toLowerCase();
      const allowedRecipes = new Set(["recipe", "kimchi"]);
      const activeRecipe = allowedRecipes.has(recipeParam) ? recipeParam : "recipe";
      recipeSelectEl.value = activeRecipe;

      recipeSelectEl.addEventListener("change", () => {
        const selectedRecipe = recipeSelectEl.value;
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("recipe", selectedRecipe);
        window.location.href = nextUrl.toString();
      });

      async function renderGraph() {
        const recipeName = recipeSelectEl.value;
        const response = await fetch(`/recipe.mmd?recipe=${encodeURIComponent(recipeName)}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed to load graph (${response.status})`);
        }

        const graphDefinition = await response.text();
        if (!graphDefinition.trim()) {
          throw new Error("Mermaid graph is empty");
        }

        const { svg } = await mermaid.render(`recipe-graph-${recipeName}`, graphDefinition);
        graphEl.innerHTML = svg;
        statusEl.textContent = `Loaded Mermaid graph for ${recipeName}`;
      }

      renderGraph().catch((error) => {
        console.error(error);
        statusEl.textContent = error.message || "Failed to render graph";
      });
    </script>
  </body>
</html>
