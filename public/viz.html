<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Graph</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: 48px 1fr 36px;
      }

      #controls {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border-bottom: 1px solid #e5e7eb;
        background: #f9fafb;
      }

      #controls a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }

      #controls a.active {
        color: #111827;
        text-decoration: underline;
      }

      #graph {
        overflow: auto;
        padding: 16px;
      }

      #status {
        height: 36px;
        line-height: 36px;
        padding: 0 12px;
        border-top: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #111827;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <span>Recipe:</span>
      <a id="cookie-link" href="/viz.html?recipe=cookie">Cookie visualization</a>
      <a id="kimchi-link" href="/viz.html?recipe=kimchi">Kimchi visualization</a>
    </div>
    <div id="graph"></div>
    <div id="status">Loading graph…</div>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      const graphEl = document.getElementById("graph");
      const statusEl = document.getElementById("status");
      const cookieLinkEl = document.getElementById("cookie-link");
      const kimchiLinkEl = document.getElementById("kimchi-link");

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose"
      });

      const recipeFromQuery = new URLSearchParams(window.location.search).get("recipe") || "";
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const recipeFromPath = (pathParts[pathParts.length - 1] || "").toLowerCase();
      const allowedRecipes = new Set(["cookie", "kimchi"]);
      const activeRecipe = allowedRecipes.has(recipeFromQuery.toLowerCase())
        ? recipeFromQuery.toLowerCase()
        : (allowedRecipes.has(recipeFromPath) ? recipeFromPath : "cookie");

      cookieLinkEl.classList.toggle("active", activeRecipe === "cookie");
      kimchiLinkEl.classList.toggle("active", activeRecipe === "kimchi");

      async function renderGraph() {
        const recipeName = activeRecipe;
        const response = await fetch(`/recipe.mmd?recipe=${encodeURIComponent(recipeName)}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed to load graph (${response.status})`);
        }

        const graphDefinition = await response.text();
        if (!graphDefinition.trim()) {
          throw new Error("Mermaid graph is empty");
        }

        const { svg } = await mermaid.render(`recipe-graph-${recipeName}`, graphDefinition);
        graphEl.innerHTML = svg;
        statusEl.textContent = `Loaded Mermaid graph for ${recipeName}`;
      }

      renderGraph().catch((error) => {
        console.error(error);
        statusEl.textContent = error.message || "Failed to render graph";
      });
    </script>
  </body>
</html>
